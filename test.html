<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鱼羊野史 - 全球历史故事地图</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Microsoft YaHei', Arial, sans-serif; 
            background-color: #1a1a1a; 
            color: #f5f5dc;
        }
        #globe-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #loading { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            z-index: 9999; 
        }
        .loading-spinner {
            width: 50px; height: 50px; 
            border: 4px solid rgba(212, 165, 116, 0.2);
            border-top: 4px solid #d4a574;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #loading-text { margin-top: 20px; color: #d4a574; font-size: 18px; }
        #status { position: fixed; bottom: 20px; left: 20px; color: #888; font-size: 12px; z-index: 100; }
    </style>
</head>
<body>
    <div id="globe-container"></div>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div id="loading-text">正在加载中...</div>
    </div>
    <div id="status"></div>
    
    <script src="data.js"></script>
    
    <script>
        console.log('🎯 开始运行最小化测试版...');
        
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const loadingTextEl = document.getElementById('loading-text');
        
        function setStatus(text) {
            console.log(text);
            statusEl.textContent = text;
        }
        
        function setLoading(text) {
            loadingTextEl.textContent = text;
            console.log('📢', text);
        }
        
        function hideLoading() {
            loadingEl.style.display = 'none';
        }
        
        // 主要初始化
        setStatus('等待页面完全加载...');
        
        window.onload = function() {
            setStatus('✅ 页面加载完成!');
            console.log('✅ 页面加载完成!');
            
            try {
                setStatus('🌍 检查 Globe 构造函数...');
                console.log('Globe type:', typeof Globe);
                
                if (typeof Globe === 'undefined') {
                    throw new Error('Globe 构造函数不存在');
                }
                
                setStatus('✅ Globe 构造函数加载成功!');
                setLoading('正在创建地球...');
                
                const globeContainer = document.getElementById('globe-container');
                const globe = new Globe(globeContainer);
                
                setStatus('✅ 地球创建成功!');
                console.log('✅ 地球实例:', globe);
                
                setLoading('正在配置地球...');
                globe
                    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
                    .pointOfView({ lat: 35, lng: 105, altitude: 2.5 }, 0);
                
                setStatus('✅ 地球配置成功!');
                
                // 添加点数据
                if (typeof storiesData !== 'undefined' && storiesData.length > 0) {
                    setStatus(`正在渲染 ${storiesData.length} 个点...`);
                    setLoading('正在渲染点...');
                    
                    const categoryColors = {
                        '政治': '#c0392b',
                        '战争': '#e74c3c',
                        '文化': '#3498db',
                        '科技': '#f39c12',
                        '人物': '#9b59b6',
                        '其他': '#95a5a6'
                    };
                    
                    const pointsData = storiesData.map(story => ({
                        ...story,
                        color: categoryColors[story.category] || '#d4a574'
                    }));
                    
                    globe.pointsData(pointsData)
                        .pointLat(d => d.coordinate.lat)
                        .pointLng(d => d.coordinate.lng)
                        .pointColor(d => d.color)
                        .pointAltitude(0.08)
                        .pointRadius(0.7)
                        .pointLabel(d => `
                            <div style="padding:5px; color:#fff; font-family:Arial;">
                                <div style="font-weight:bold; color:#d4a574;">${d.title}</div>
                                <div>📅 ${d.year}</div>
                                <div>🏷️ ${d.category}</div>
                            </div>
                        `);
                    
                    setStatus(`✅ ${storiesData.length} 个点渲染成功!`);
                } else {
                    setStatus('⚠️ 数据未加载');
                }
                
                hideLoading();
                setStatus('🎉 全部完成!');
                console.log('🎉 最小化测试版运行成功!');
                
            } catch (error) {
                console.error('❌ 错误:', error);
                console.error('❌ 堆栈:', error.stack);
                setStatus('❌ 错误: ' + error.message);
                loadingTextEl.innerHTML = `
                    ❌ 加载失败!<br>
                    错误: ${error.message}<br><br>
                    <small>请按 F12 查看控制台详细信息</small>
                `;
            }
        };
    </script>
</body>
</html>
